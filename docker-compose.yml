version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn_db}
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churn_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn_user} -d ${POSTGRES_DB:-churn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
      dockerfile: Docker/Dockerfile.etl
    container_name: churn_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD:-churn_pass}@postgres:5432/${POSTGRES_DB:-churn_db}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs

  api:
    build:
      context: .
      dockerfile: Docker/Dockerfile.api
    container_name: churn_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD:-churn_pass}@postgres:5432/${POSTGRES_DB:-churn_db}
      MODEL_DIR: /app/models
      SEGMENTED_DATA_PATH: /app/data/processed/telecom_customers_segmented.csv
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro

volumes:
  postgres_data:
