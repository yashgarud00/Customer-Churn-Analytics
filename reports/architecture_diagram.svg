<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="IBM Plex Mono, monospace">
<rect width="1200" height="520" fill="#0b1420"/>
<text x="30" y="35" fill="#e8edf4" font-size="18" font-weight="700">Customer Churn Analytics — System Architecture</text>

<!-- Raw data -->
<rect x="30" y="90" width="150" height="70" rx="6" fill="#101c2c" stroke="#22334a"/>
<text x="45" y="120" fill="#e8edf4" font-size="11">CRM / Billing</text>
<text x="45" y="136" fill="#7d90a8" font-size="10">raw CSV export</text>

<line x1="180" y1="125" x2="230" y2="125" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- ETL -->
<rect x="230" y="90" width="160" height="70" rx="6" fill="#101c2c" stroke="#4fd1ff" stroke-width="1.5"/>
<text x="245" y="115" fill="#4fd1ff" font-size="11" font-weight="700">ETL Pipeline</text>
<text x="245" y="132" fill="#7d90a8" font-size="10">extract·transform·load</text>
<text x="245" y="146" fill="#7d90a8" font-size="10">logging + DQ report</text>

<line x1="390" y1="125" x2="440" y2="125" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Postgres -->
<rect x="440" y="90" width="160" height="70" rx="6" fill="#101c2c" stroke="#35c4a1" stroke-width="1.5"/>
<text x="455" y="115" fill="#35c4a1" font-size="11" font-weight="700">PostgreSQL</text>
<text x="455" y="132" fill="#7d90a8" font-size="10">star schema</text>
<text x="455" y="146" fill="#7d90a8" font-size="10">views · procedures</text>

<line x1="310" y1="160" x2="310" y2="220" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Feature engineering -->
<rect x="230" y="220" width="160" height="70" rx="6" fill="#101c2c" stroke="#22334a"/>
<text x="245" y="245" fill="#e8edf4" font-size="11">Feature Engineering</text>
<text x="245" y="262" fill="#7d90a8" font-size="10">business features</text>
<text x="245" y="276" fill="#7d90a8" font-size="10">EDA + statistics</text>

<line x1="390" y1="255" x2="440" y2="255" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- ML training -->
<rect x="440" y="220" width="160" height="70" rx="6" fill="#101c2c" stroke="#f2b84b" stroke-width="1.5"/>
<text x="455" y="245" fill="#f2b84b" font-size="11" font-weight="700">ML Training</text>
<text x="455" y="262" fill="#7d90a8" font-size="10">LogReg·Tree·RF·XGB</text>
<text x="455" y="276" fill="#7d90a8" font-size="10">+ K-Means segments</text>

<line x1="600" y1="255" x2="650" y2="255" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Model artifacts -->
<rect x="650" y="220" width="140" height="70" rx="6" fill="#101c2c" stroke="#22334a"/>
<text x="665" y="245" fill="#e8edf4" font-size="11">Model Registry</text>
<text x="665" y="262" fill="#7d90a8" font-size="10">models/*.pkl</text>
<text x="665" y="276" fill="#7d90a8" font-size="10">metrics.json</text>

<line x1="790" y1="255" x2="840" y2="255" stroke="#4fd1ff" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="520" y1="160" x2="520" y2="220" stroke="#35c4a1" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Flask API -->
<rect x="840" y="220" width="170" height="70" rx="6" fill="#101c2c" stroke="#8b7de8" stroke-width="1.5"/>
<text x="855" y="245" fill="#8b7de8" font-size="11" font-weight="700">Flask REST API</text>
<text x="855" y="262" fill="#7d90a8" font-size="10">/predict /customers</text>
<text x="855" y="276" fill="#7d90a8" font-size="10">/analytics /dashboard</text>

<line x1="925" y1="220" x2="925" y2="170" stroke="#8b7de8" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="600" y1="130" x2="840" y2="220" stroke="#22334a" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Consumers -->
<rect x="840" y="360" width="150" height="70" rx="6" fill="#101c2c" stroke="#22334a"/>
<text x="855" y="385" fill="#e8edf4" font-size="11">Power BI</text>
<text x="855" y="402" fill="#7d90a8" font-size="10">exec dashboard</text>

<rect x="1010" y="360" width="150" height="70" rx="6" fill="#101c2c" stroke="#22334a"/>
<text x="1025" y="385" fill="#e8edf4" font-size="11">Web Dashboard</text>
<text x="1025" y="402" fill="#7d90a8" font-size="10">dashboard/index.html</text>

<line x1="915" y1="290" x2="915" y2="360" stroke="#8b7de8" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="965" y1="290" x2="1080" y2="360" stroke="#8b7de8" stroke-width="1.5" marker-end="url(#a1)"/>

<!-- Docker wrapper -->
<rect x="15" y="440" width="1170" height="60" rx="6" fill="none" stroke="#22334a" stroke-dasharray="6,4"/>
<text x="30" y="460" fill="#4fd1ff" font-size="11" font-weight="700">Docker Compose</text>
<text x="30" y="478" fill="#7d90a8" font-size="10">postgres · etl (one-off job) · api (gunicorn, healthchecked) — orchestrated via docker-compose.yml, deployable to Render/Railway/Fly.io</text>

<defs>
  <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4fd1ff"/></marker>
</defs>
</svg>
